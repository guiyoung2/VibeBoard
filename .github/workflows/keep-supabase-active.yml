# 2일마다 Supabase 프로젝트 상태를 확인하고, 정지(INACTIVE) 상태면 Management API로 복원합니다.
# 기존 방식(REST ping만)은 이미 정지된 상태에서 실패했음 → Management API로 직접 복원하도록 개선.
#
# 필요한 GitHub Secrets:
#   SUPABASE_URL          - https://xxx.supabase.co
#   SUPABASE_ANON_KEY     - anon/public 키
#   SUPABASE_PROJECT_REF  - URL의 서브도메인 부분 (예: oqxyaohnpwapmxhqgypt)
#   SUPABASE_ACCESS_TOKEN - Supabase 계정 Personal Access Token
#                           발급: https://supabase.com/dashboard/account/tokens

name: Keep Supabase active

on:
  schedule:
    # UTC 00:00, 2일마다 (7일 한도보다 충분히 여유 있게)
    - cron: "0 0 */2 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: 프로젝트 상태 확인 및 정지 시 복원
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Management API로 현재 프로젝트 상태 조회
          STATUS=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            | jq -r '.status // "unknown"')

          echo "현재 프로젝트 상태: $STATUS"

          # 정지 상태(INACTIVE)이면 복원 API 호출
          if [ "$STATUS" = "INACTIVE" ]; then
            echo "프로젝트가 정지됨 → Management API로 복원 요청 중..."
            curl -sf -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restore"

            # 복원 완료될 때까지 대기 (최대 5분, 30초 간격)
            for i in $(seq 1 10); do
              echo "복원 대기 중... ($i/10, 30초 간격)"
              sleep 30
              NEW_STATUS=$(curl -sf \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
                | jq -r '.status // "unknown"')
              echo "현재 상태: $NEW_STATUS"
              if [ "$NEW_STATUS" = "ACTIVE_HEALTHY" ]; then
                echo "복원 완료!"
                break
              fi
              if [ "$i" = "10" ]; then
                echo "복원 타임아웃 (5분 초과)"
                exit 1
              fi
            done
          fi

          # 최종 REST API ping으로 정상 응답 확인
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/boardgames?limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json")

          if [ "$CODE" != "200" ]; then
            echo "Supabase REST ping 실패 (HTTP $CODE)"
            exit 1
          fi
          echo "Supabase REST ping 성공 (HTTP $CODE)"

