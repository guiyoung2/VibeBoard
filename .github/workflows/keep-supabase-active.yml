# 3일마다 Supabase 프로젝트에 요청을 보내서 7일 비활성 일시정지를 막습니다.
# 실패 시(HTTP 200 아님) 워크플로가 실패하므로 GitHub 알림/이메일로 확인 가능합니다.

name: Keep Supabase active

on:
  schedule:
    # UTC 00:00, 3일마다 (1,4,7,10,13,16,19,22,25,28일)
    - cron: "0 0 1,4,7,10,13,16,19,22,25,28 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (REST API)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/boardgames?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          if [ "$CODE" != "200" ]; then
            echo "Supabase REST ping failed with HTTP $CODE"
            exit 1
          fi
          echo "Supabase REST ping OK (HTTP $CODE)"

